<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazorkit Smart Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; overflow-x: hidden; }
        .dark-mode { background-color: #050505; color: #ffffff; }
        .light-mode { background-color: #f8fafc; color: #0f172a; }
        .card { border-radius: 2rem; border: 1px solid rgba(128, 128, 128, 0.1); transition: 0.3s; }
        .dark-mode .card { background: #111; }
        .light-mode .card { background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .input-box { border-radius: 1.2rem; padding: 1rem; width: 100%; outline: none; border: 1px solid rgba(128, 128, 128, 0.2); background: rgba(128, 128, 128, 0.05); color: inherit; }
        #lock-screen { position: fixed; inset: 0; z-index: 100; background: black; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 1s ease-in-out; }
        .unlocked { transform: scale(5); opacity: 0; pointer-events: none; }
        .loader { border: 2px solid rgba(99, 102, 241, 0.2); border-top: 2px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #chart-container { height: 250px; border-radius: 1.5rem; overflow: hidden; display: none; margin-top: 1rem; }
    </style>
</head>
<body class="dark-mode min-h-screen flex justify-center">

    <div id="lock-screen">
        <div id="login-init" class="text-center p-6">
            <div class="mb-8">
                <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="w-20 h-20 mx-auto animate-bounce">
            </div>
            <h1 class="text-4xl font-black italic text-white mb-12 tracking-tighter">LAZORKIT</h1>
            <button onclick="startBountyLogin()" class="w-72 bg-white text-black py-5 rounded-3xl font-black uppercase text-xs tracking-[0.2em] active:scale-95 transition shadow-2xl">Create Smart Wallet</button>
        </div>
        
        <div id="login-loading" class="hidden text-center space-y-8">
            <div class="loader mx-auto"></div>
            <div class="space-y-2">
                <p id="status-text" class="text-indigo-500 text-[10px] font-black uppercase tracking-[0.3em]">Initializing...</p>
                <div class="w-48 h-1 bg-white/10 mx-auto rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-indigo-600 w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="main-app" class="max-w-md w-full p-4 opacity-0 transition-opacity duration-1000">
        
        <div class="flex justify-between items-center mb-6 px-2 pt-4">
            <h1 class="text-2xl font-black italic tracking-tighter text-indigo-500">SOLANA</h1>
            <button onclick="toggleTheme()" class="p-3 bg-gray-500/10 rounded-2xl">
                <span id="theme-icon">🌙</span>
            </button>
        </div>

        <div class="p-8 rounded-[2.5rem] mb-8 bg-gradient-to-br from-indigo-600 to-purple-700 text-white shadow-xl">
            <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest mb-1">Total Assets</p>
            <h2 id="total-val" class="text-4xl font-extrabold mb-8 tracking-tighter">$1,200.00</h2>
            
            <div class="flex items-center gap-3">
                <div class="flex-1 flex flex-col items-center">
                    <button class="w-full py-3 rounded-xl bg-white/10 font-bold text-[10px] uppercase opacity-40 cursor-not-allowed">Deposit</button>
                    <p class="text-[8px] mt-1 opacity-0">spacer</p>
                </div>
                <div class="flex-1 flex flex-col items-center">
                    <button onclick="showPage('withdraw')" class="w-full py-3 rounded-xl bg-white/20 font-bold text-[10px] uppercase tracking-widest">Withdraw</button>
                    <p class="text-[8px] font-bold mt-1 opacity-60">gasless</p>
                </div>
                <div class="flex-1 flex flex-col items-center">
                    <button onclick="showPage('swap')" class="w-full py-3 rounded-xl bg-white text-indigo-600 font-bold text-[10px] uppercase shadow-lg tracking-widest">Swap</button>
                    <p class="text-[8px] font-bold mt-1 opacity-60 text-indigo-200">gasless</p>
                </div>
            </div>
        </div>

        <div id="view-dash" class="space-y-6">
            <div class="space-y-4">
                <h3 class="text-[10px] font-bold opacity-40 uppercase tracking-widest px-2">Portfolio</h3>
                
                <div onclick="toggleChart()" class="card p-5 flex flex-col cursor-pointer border-none shadow-sm">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <img src="https://cryptologos.cc/logos/solana-sol-logo.png" class="w-10 h-10">
                            <div><p class="font-bold text-sm">Solana</p><p id="sol-qty" class="text-xs opacity-50 font-bold">8.27 SOL</p></div>
                        </div>
                        <div class="text-right">
                            <p id="sol-usd" class="font-bold text-sm">$1,200.00</p>
                            <p class="text-[8px] text-indigo-500 font-bold">CHART ↓</p>
                        </div>
                    </div>
                    <div id="chart-container"><div id="tv_widget" style="height: 100%;"></div></div>
                </div>

                <div class="card p-5 flex justify-between items-center border-none shadow-sm">
                    <div class="flex items-center gap-4">
                        <img src="https://cryptologos.cc/logos/usd-coin-usdc-logo.png" class="w-10 h-10">
                        <div><p class="font-bold text-sm">USD Coin</p><p id="usdc-qty" class="text-xs opacity-50 font-bold">0.00 USDC</p></div>
                    </div>
                    <p id="usdc-usd" class="font-bold text-sm">$0.00</p>
                </div>
            </div>

            <div class="space-y-4 pb-10">
                <h3 class="text-[10px] font-bold opacity-40 uppercase tracking-widest px-2">Recent History</h3>
                <div id="history-list" class="space-y-3 px-1">
                    <p class="text-center text-xs opacity-30 italic py-4">No recent activity</p>
                </div>
            </div>
        </div>

        <div id="view-withdraw" class="hidden space-y-6">
            <button onclick="showPage('dash')" class="opacity-40 text-[10px] font-bold uppercase tracking-widest">← Back</button>
            <div class="card p-8 space-y-5">
                <h2 class="text-xl font-black italic text-indigo-500 uppercase">Send Assets</h2>
                <input type="text" id="w-addr" placeholder="Recipient Address" class="input-box text-sm">
                <div class="relative">
                    <input type="number" id="w-amt" placeholder="0.00" class="input-box text-2xl font-bold">
                    <button onclick="setMax('sol')" class="absolute right-4 top-4 text-indigo-500 font-bold text-[10px] uppercase">Max</button>
                </div>
                <button onclick="processGasless('Withdraw')" class="w-full py-5 bg-indigo-600 text-white rounded-3xl font-black uppercase text-xs tracking-widest">Confirm Gasless Send</button>
            </div>
        </div>

        <div id="view-swap" class="hidden space-y-6">
            <button onclick="showPage('dash')" class="opacity-40 text-[10px] font-bold uppercase tracking-widest">← Back</button>
            <div class="card p-8 space-y-6 text-center">
                <h2 class="text-xl font-black italic text-indigo-500 uppercase">Smart Swap</h2>
                <div class="flex justify-between items-center px-6 bg-gray-500/5 py-4 rounded-2xl">
                    <span id="from-symbol" class="font-black text-xs">SOL</span>
                    <button onclick="reverseSwap()" class="bg-indigo-600 p-2 rounded-full text-[10px]">⇅</button>
                    <span id="to-symbol" class="font-black text-xs text-indigo-400">USDC</span>
                </div>
                <div class="relative">
                    <input type="number" id="s-amt" placeholder="0.00" class="input-box text-2xl font-bold text-center">
                    <button onclick="setMax('swap')" class="absolute right-4 top-4 text-indigo-500 font-bold text-[10px] uppercase">Max</button>
                </div>
                <button onclick="processGasless('Swap')" class="w-full py-5 bg-indigo-600 text-white rounded-3xl font-black uppercase text-xs tracking-widest">Confirm Swap</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let solBalance = 8.27; 
        let usdcBalance = 0.00;
        let isSolToUsdc = true;
        let transactions = [];
        const SOL_PRICE = 145;

        function startBountyLogin() {
            document.getElementById('login-init').classList.add('hidden');
            document.getElementById('login-loading').classList.remove('hidden');
            const steps = ["Securing Device...", "Creating Passkey...", "Deploying Account...", "Syncing Solana...", "Wallet Ready!"];
            let i = 0;
            const timer = setInterval(() => {
                document.getElementById('status-text').innerText = steps[i];
                document.getElementById('progress-bar').style.width = ((i+1) * 20) + "%";
                i++;
                if(i >= steps.length) {
                    clearInterval(timer);
                    document.getElementById('lock-screen').classList.add('unlocked');
                    document.getElementById('main-app').style.opacity = '1';
                }
            }, 850);
        }

        function toggleTheme() {
            const b = document.body;
            b.classList.toggle('dark-mode'); b.classList.toggle('light-mode');
            document.getElementById('theme-icon').innerText = b.classList.contains('dark-mode') ? "🌙" : "☀️";
        }

        function toggleChart() {
            const c = document.getElementById('chart-container');
            c.style.display = c.style.display === 'none' ? 'block' : 'none';
            if(c.style.display === 'block') {
                new TradingView.widget({"autosize": true,"symbol": "BINANCE:SOLUSDT","interval": "H","theme": document.body.classList.contains('dark-mode') ? "dark" : "light","style": "3","container_id": "tv_widget","hide_top_toolbar": true});
            }
        }

        function reverseSwap() {
            isSolToUsdc = !isSolToUsdc;
            document.getElementById('from-symbol').innerText = isSolToUsdc ? 'SOL' : 'USDC';
            document.getElementById('to-symbol').innerText = isSolToUsdc ? 'USDC' : 'SOL';
        }

        function setMax(mode) {
            if(mode === 'sol') document.getElementById('w-amt').value = solBalance;
            else document.getElementById('s-amt').value = isSolToUsdc ? solBalance : usdcBalance;
        }

        function processGasless(type) {
            const wAmt = parseFloat(document.getElementById('w-amt').value);
            const sAmt = parseFloat(document.getElementById('s-amt').value);
            const addr = document.getElementById('w-addr').value;

            if(type === 'Withdraw') {
                if(!addr) return alert("Please enter destination address");
                if(!wAmt || wAmt > solBalance) return alert("Insufficient SOL balance");
                solBalance -= wAmt;
                transactions.unshift({type: 'Sent', amt: wAmt, asset: 'SOL', detail: 'to ' + addr.substring(0,6)+'...', time: 'Just now'});
            } else {
                if(!sAmt) return alert("Please enter amount");
                if(isSolToUsdc) {
                    if(sAmt > solBalance) return alert("Insufficient SOL");
                    solBalance -= sAmt; usdcBalance += (sAmt * SOL_PRICE);
                } else {
                    if(sAmt > usdcBalance) return alert("Insufficient USDC");
                    usdcBalance -= sAmt; solBalance += (sAmt / SOL_PRICE);
                }
                transactions.unshift({type: 'Swapped', amt: sAmt, asset: isSolToUsdc?'SOL':'USDC', detail: 'to ' + (isSolToUsdc?'USDC':'SOL'), time: 'Just now'});
            }
            updateUI(); showPage('dash');
            alert(`Gasless ${type} Successful! Sponsored by Lazorkit.`);
        }

        function updateUI() {
            document.getElementById('sol-qty').innerText = solBalance.toFixed(2) + " SOL";
            document.getElementById('sol-usd').innerText = "$" + (solBalance * SOL_PRICE).toFixed(2);
            document.getElementById('usdc-qty').innerText = usdcBalance.toFixed(2) + " USDC";
            document.getElementById('usdc-usd').innerText = "$" + usdcBalance.toFixed(2);
            document.getElementById('total-val').innerText = "$" + ((solBalance * SOL_PRICE) + usdcBalance).toLocaleString(undefined, {minimumFractionDigits: 2});
            
            const list = document.getElementById('history-list');
            list.innerHTML = transactions.map(tx => `
                <div class="card p-4 flex justify-between items-center bg-white/5 border-none">
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-full bg-indigo-500/10 text-indigo-500 text-xs">↑</div>
                        <div><p class="font-bold text-xs">${tx.type} ${tx.asset}</p><p class="text-[9px] opacity-40">${tx.detail}</p></div>
                    </div>
                    <div class="text-right"><p class="font-bold text-xs text-red-400">-${tx.amt.toFixed(2)}</p><p class="text-[9px] opacity-40">${tx.time}</p></div>
                </div>
            `).join('') || '<p class="text-center text-xs opacity-30 italic py-4">No recent activity</p>';
        }

        function showPage(p) {
            ['dash', 'withdraw', 'swap'].forEach(v => document.getElementById('view-'+v).classList.add('hidden'));
            document.getElementById('view-'+p).classList.remove('hidden');
        }
    </script>
</body>
</html>
